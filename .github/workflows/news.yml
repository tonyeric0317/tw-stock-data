name: news-collect

on:
  schedule:
    - cron: "7,37 * * * *"    # 每 30 分鐘累積一次新聞
    - cron: "52 22 * * *"     # 台灣 06:52，晨報前最後一次
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 收集新聞
        run: python news.py
      - name: 存回 GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git commit -q -m "news $(TZ=Asia/Taipei date +%m%d-%H%M)" || exit 0
          git pull --rebase -q
          git push -q
