name: daily-turnover

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 台灣 15:40
    - cron: "40 9 * * 1-5"   # 台灣 17:40（補跑，覆蓋成最終資料）
  workflow_dispatch:          # 可在 Actions 頁面手動執行

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓官方收盤資料
        run: |
          D=$(TZ=Asia/Taipei date +%Y%m%d)
          mkdir -p data
          python tw_turnover_rank.py --date "$D" --csv "data/turnover_$D.csv" | tee "data/summary_$D.txt"
          python make_over10.py "$D"
          # 只保留最近 60 天的每日檔案（latest_ 開頭的固定檔不會刪）
          python -c "import datetime as d,glob,os,re;c=(d.date.today()-d.timedelta(days=60)).strftime('%Y%m%d');[os.remove(f) for f in glob.glob('data/*_2*.*') if re.search(r'_(\d{8})\.',f) and re.search(r'_(\d{8})\.',f).group(1)<c]"
          # 資料日期跟查詢日期不同（還沒收盤、假日、官方未更新）→ 不覆蓋最新檔，並刪掉這次的檔案
          if grep -q "資料日期與查詢日期不同" "data/summary_$D.txt"; then
            echo "資料日期不符，不更新"; rm -f data/*_$D.*; exit 0
          fi
          # 固定檔名的最新版，給排程用固定網址讀取
          cp "data/summary_$D.txt" data/latest_summary.txt
          cp "data/over10_$D.csv" data/latest_over10.csv
          cp "data/over5_$D.csv" data/latest_over5.csv
          cp "data/top100_$D.csv" data/latest_top100.csv
          cp "data/turnover_$D.csv" data/latest_turnover.csv
      - name: 存回 GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git commit -m "data $(TZ=Asia/Taipei date +%Y%m%d)" || echo "沒有變更"
          git pull --rebase -q || true
          git push
