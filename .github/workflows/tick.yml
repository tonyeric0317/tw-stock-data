name: tick

# 主要靠外部排程（cron-job.org）每 15 分鐘呼叫 workflow_dispatch；
# GitHub 內建 schedule 常延遲或被略過，只當備援。
on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tick.py
      - name: 存回 GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A data
          git commit -q -m "tick $(TZ=Asia/Taipei date +%m%d-%H%M)" || exit 0
          git pull --rebase -q
          git push -q
