name: us-turnover

on:
  schedule:
    - cron: "40 21 * * 1-5"   # 台灣 05:40（美股收盤後；夏令時間 04:40 收盤也來得及）
    - cron: "10 22 * * 1-5"   # 台灣 06:10（補跑）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓美股收盤資料
        run: |
          D=$(TZ=America/New_York date +%Y%m%d)
          mkdir -p data
          python us_turnover.py --date "$D" --csv "data/us_top200_$D.csv" | tee "data/us_summary_$D.txt"
          cp "data/us_summary_$D.txt" data/latest_us_summary.txt
          cp "data/us_top200_$D.csv" data/latest_us_top200.csv
      - name: 存回 GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git commit -m "us data $(TZ=America/New_York date +%Y%m%d)" || echo "沒有變更"
          git pull --rebase -q || true
          git push
